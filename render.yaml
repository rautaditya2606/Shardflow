services:
  # 1. Topology Registry Service
  - type: web
    name: shardflow-registry
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: uvicorn shardflow.registry.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /topology

  # 2. OpenAI API Gateway Service
  - type: web
    name: shardflow-gateway
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: uvicorn shardflow.gateway.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SHARDFLOW_REGISTRY_URL
        fromService:
          type: web
          name: shardflow-registry
          property: host
      - key: SHARDFLOW_MODEL_PATH
        value: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
      # Point to the tokenizer cache baked into the Docker image at build time.
      # This prevents AutoTokenizer.from_pretrained() from downloading at runtime
      # and avoids the 500 MB /tmp spike that killed Render's 512 MB container.
      - key: HF_HOME
        value: "/app/.hf_cache"

