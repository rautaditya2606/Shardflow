name: Archive GitHub Traffic Metrics

on:
  schedule:
    # Runs daily at 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Traffic Archiver
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/archive_traffic.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/traffic_data/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(analytics): auto-update daily traffic stats [skip ci]"
            git push
          fi
